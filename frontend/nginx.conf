server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O front chama a API pelo mesmo endereço em que foi aberto (/api/...),
  # e o nginx repassa para o container da API pela rede interna do compose.
  # Assim funciona acessando por localhost, IP da rede ou outro dispositivo,
  # sem depender da porta da API publicada no host.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location ~* \.(js|css|ico|png|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
